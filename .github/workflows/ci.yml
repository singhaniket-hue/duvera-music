name: Test music pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - run: python -m pip install -e ".[dev,cv,edit]"
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: python scripts/run_real_checks.py
      - run: python -m src.cli --check-env
